<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomJoy Florist - Digital Catalog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-rose-50/40 text-slate-800 antialiased font-sans pb-24 md:pb-8">

  <!-- Header & Navbar -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md shadow-sm border-b border-rose-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold text-xl shadow-md">🌸</div>
        <div>
          <h1 class="font-bold text-lg leading-tight text-slate-800">BloomJoy <span class="text-rose-500">Florist</span></h1>
          <p class="text-xs text-slate-500">Katalog Digital Toko Bunga</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="toggleAdminModal()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-full transition flex items-center gap-1">
          <i class="fa-solid fa-gear"></i> Kelola Stok
        </button>
        <button onclick="openCart()" class="relative p-2.5 text-rose-600 hover:bg-rose-50 rounded-full transition">
          <i class="fa-solid fa-basket-shopping text-xl"></i>
          <span id="cartBadge" class="hidden absolute top-1 right-1 bg-rose-500 text-white text-[10px] font-bold w-4 h-4 rounded-full items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-6">
    <!-- Banner Search & Category Filter -->
    <section class="mb-6 space-y-4">
      <div class="relative">
        <input type="text" id="searchInput" oninput="renderCatalog()" placeholder="Cari nama bunga atau buket..." 
               class="w-full pl-10 pr-4 py-3 bg-white border border-rose-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
      </div>

      <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categoryContainer">
        <button onclick="filterCategory('all')" class="cat-btn active border px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-rose-500 text-white border-rose-500 shadow-sm transition">Semua Produk</button>
        <button onclick="filterCategory('Buket')" class="cat-btn border px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-white text-slate-600 border-rose-200 hover:bg-rose-50 transition">Buket Bunga</button>
        <button onclick="filterCategory('Kotak')" class="cat-btn border px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-white text-slate-600 border-rose-200 hover:bg-rose-50 transition">Bloom Box</button>
        <button onclick="filterCategory('Papan')" class="cat-btn border px-4 py-1.5 rounded-full text-xs font-medium whitespace-nowrap bg-white text-slate-600 border-rose-200 hover:bg-rose-50 transition">Bunga Papan</button>
      </div>
    </section>

    <!-- Catalog Grid -->
    <section id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6">
      <!-- Diisi otomatis oleh JavaScript -->
    </section>
  </main>

  <!-- Mobile Floating Order Bar -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-rose-100 p-3 shadow-lg md:hidden z-20">
    <div class="flex items-center justify-between gap-3 max-w-6xl mx-auto">
      <div>
        <p class="text-[10px] text-slate-400 uppercase font-semibold">Total Pesanan</p>
        <p id="floatingTotal" class="font-bold text-rose-600 text-sm">Rp 0</p>
      </div>
      <button onclick="openCart()" class="bg-rose-500 hover:bg-rose-600 text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow-md flex items-center gap-2">
        <i class="fa-solid fa-cart-shopping"></i> Lihat Keranjang
      </button>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cartModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl animate-slide-left">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-rose-50">
        <h3 class="font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-basket-shopping text-rose-500"></i> Keranjang Bunga
        </h3>
        <button onclick="closeCart()" class="text-slate-400 hover:text-slate-600 p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100">
        <!-- Item Keranjang JS -->
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50 space-y-3">
        <div class="space-y-2">
          <input type="text" id="custName" placeholder="Nama Pemesan *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-1 focus:ring-rose-400">
          <textarea id="cardMessage" rows="2" placeholder="Pesan Kartu Ucapan (opsional)..." class="w-full text-xs p-2.5 border rounded-lg focus:ring-1 focus:ring-rose-400"></textarea>
        </div>
        <div class="flex justify-between items-center text-sm font-bold pt-2 border-t">
          <span>Total Bayar:</span>
          <span id="cartTotal" class="text-rose-600 text-base">Rp 0</span>
        </div>
        <button onclick="sendToWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-md text-xs flex items-center justify-center gap-2">
          <i class="fa-brands fa-whatsapp text-base"></i> Kirim Pesanan via WhatsApp
        </button>
      </div>
    </div>
  </div>

  <!-- Admin Modal -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
      <div class="p-4 border-b flex justify-between items-center bg-slate-800 text-white">
        <h3 class="font-bold text-sm"><i class="fa-solid fa-sliders"></i> Panel Pengelola Stok</h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="adminList" class="p-4 max-h-80 overflow-y-auto divide-y">
        <!-- Diisi JS -->
      </div>
      <div class="p-3 bg-slate-100 text-right">
        <button onclick="toggleAdminModal()" class="px-4 py-2 bg-slate-300 hover:bg-slate-400 text-slate-800 rounded-lg text-xs font-semibold">Tutup</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
